<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Tracker</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <meta name="keywords" content="Daily Tracker, Daily Tally, Track, Tally">
    <meta name="description" content="Track how many times you do activities daily. This website lets you add tallies that for each day has it's own data value. You can also see the total per year or per month. Data is stored locally.">
    <meta name="author" content="Miles Chase">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <header class="app-header">
            <h1>Daily Tracker</h1>
            <p class="subtitle">Track your habits, goals, and daily progress</p>
        </header>

        <main class="main-card">
            <!-- Date Navigator -->
            <section class="date-navigator">
                <button class="btn-icon" onclick="changeDate(-1)" aria-label="Previous Day">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <div class="date-display">
                    <input type="date" id="datePicker" class="date-input">
                </div>
                <button class="btn-icon" onclick="changeDate(1)" aria-label="Next Day">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </button>
            </section>

            <!-- Stats Grid -->
            <section class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">📅</div>
                    <div class="stat-content">
                        <span class="stat-value" id="daysTracked">0</span>
                        <span class="stat-label">Days Tracked</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⚡</div>
                    <div class="stat-content">
                        <span class="stat-value" id="currentStreak">0</span>
                        <span class="stat-label">Current Streak</span>
                    </div>
                </div>
            </section>

            <!-- Habit Add Form -->
            <section class="add-section">
                <div id="addItemForm" class="add-form">
                    <input type="text" id="newItemName" placeholder="What habit are we tracking today?" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                    <button onclick="addNewItem()" class="btn-primary">Add Habit</button>
                </div>
            </section>

            <!-- Habits List -->
            <section class="habits-section">
                <div id="items" class="habits-container"></div>
            </section>

            <!-- Summaries (Accordions) -->
            <section class="history-section">
                <details class="accordion-item" open>
                    <summary class="accordion-header">
                        <span>Monthly Summary</span>
                        <svg class="accordion-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                    </summary>
                    <div class="accordion-content">
                        <div id="monthTotals"></div>
                    </div>
                </details>
                
                <details class="accordion-item">
                    <summary class="accordion-header">
                        <span>Yearly Summary</span>
                        <svg class="accordion-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                    </summary>
                    <div class="accordion-content">
                        <div id="yearTotals"></div>
                    </div>
                </details>
            </section>
        </main>

        <footer class="app-footer">
            <div id="dataAlert" class="alert closebtn">
                <div class="alert-content">
                    <span class="alert-icon">🔒</span>
                    <strong>All Data Stored Locally</strong>
                </div>
            </div>
            
            <div class="data-actions">
                <button class="btn-outline" onclick="downloadData()">Export Data</button>
                <input type="file" id="fileUpload" accept=".txt" onchange="uploadData(event)" hidden>
                <button class="btn-outline" onclick="document.getElementById('fileUpload').click()">Import Data</button>
                <button class="btn-danger" onclick="clearData()">Clear Data</button>
            </div>
        </footer>
    </div>

    <script src="keyword.js"></script>
    <script src="script.js"></script>
    <script src="time.js"></script>
</body>
</html>
